model_id: "unsloth/Qwen3-4B-Base"
max_seq_length: 2048
output_dir: "./outputs/math_reasoning/sft/openr1_math"
dataset_split: "train"

# Data filtering
max_example_tokens: 1024
max_samples: 128
require_reasoning_complete: true

# Training
learning_rate: 2.0e-4
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
num_train_epochs: 2
logging_steps: 5

# LoRA
lora_r: 8
lora_alpha: 16
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
